name: Bug report
description: Report behavior that is broken or different from the documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Eve. Never include an API key, transcript,
        recording, remembered fact, personal path, or other private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest sequence that demonstrates the problem.
      placeholder: |
        1. Start Eve with ...
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Linux distribution, CPU architecture, Python version, and install method.
      placeholder: Raspberry Pi OS 64-bit, aarch64, Raspberry Pi 5, CPython 3.11, git clone
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Relevant hardware
      description: List microphone, audio output, display, and touch hardware involved, or say "none."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or other evidence
      description: Remove speech content, keys, usernames, hostnames, and personal paths before pasting anything.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing report of this problem.
          required: true
        - label: I removed credentials, speech content, and personal information.
          required: true
