version: 2
# Keep update PRs independent: SDK, inference, and action upgrades have
# different compatibility surfaces and should be attributable when CI fails.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
